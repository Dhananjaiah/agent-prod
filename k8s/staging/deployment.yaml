apiVersion: v1
kind: ConfigMap
metadata:
  name: insurance-assistant-config
  namespace: insurance-staging
data:
  APP_ENV: "staging"
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: insurance-assistant-secrets
  namespace: insurance-staging
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholder values before deployment!
  # Use external secret management (AWS Secrets Manager, HashiCorp Vault, etc.)
  # or Kubernetes external-secrets operator for production use.
  DATABASE_URL: "REPLACE_WITH_ACTUAL_DATABASE_URL"
  OPENAI_API_KEY: "REPLACE_WITH_ACTUAL_OPENAI_API_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-assistant
  namespace: insurance-staging
  labels:
    app: insurance-assistant
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insurance-assistant
  template:
    metadata:
      labels:
        app: insurance-assistant
        environment: staging
    spec:
      containers:
        - name: insurance-assistant
          image: insurance-assistant:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: insurance-assistant-config
            - secretRef:
                name: insurance-assistant-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: insurance-assistant
  namespace: insurance-staging
spec:
  type: ClusterIP
  selector:
    app: insurance-assistant
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: insurance-assistant
  namespace: insurance-staging
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: insurance-staging.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: insurance-assistant
                port:
                  number: 80
