apiVersion: v1
kind: ConfigMap
metadata:
  name: insurance-assistant-config
  namespace: insurance-production
data:
  APP_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "WARNING"
---
apiVersion: v1
kind: Secret
metadata:
  name: insurance-assistant-secrets
  namespace: insurance-production
type: Opaque
stringData:
  # CRITICAL: DO NOT deploy with placeholder values!
  # Use external secret management (AWS Secrets Manager, HashiCorp Vault, etc.)
  # or Kubernetes external-secrets operator for production use.
  # These placeholders will cause the application to fail if not replaced.
  DATABASE_URL: "REPLACE_WITH_ACTUAL_DATABASE_URL"
  OPENAI_API_KEY: "REPLACE_WITH_ACTUAL_OPENAI_API_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-assistant
  namespace: insurance-production
  labels:
    app: insurance-assistant
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: insurance-assistant
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: insurance-assistant
        environment: production
    spec:
      containers:
        - name: insurance-assistant
          image: insurance-assistant:production
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: insurance-assistant-config
            - secretRef:
                name: insurance-assistant-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - insurance-assistant
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: insurance-assistant
  namespace: insurance-production
spec:
  type: ClusterIP
  selector:
    app: insurance-assistant
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: insurance-assistant
  namespace: insurance-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - insurance.example.com
      secretName: insurance-tls-secret
  rules:
    - host: insurance.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: insurance-assistant
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insurance-assistant
  namespace: insurance-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insurance-assistant
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
